<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answer the Questions | TED Talk Support Pathway</title>
<style>
:root{--a:#2F5D8A;--a2:#E0ECF8;--b:#E8A33D;--ink:#14243A;--bg:#F5F9FD;--muted:#6B6460;--line:#E8E1D9;--ok:#2E9E62;--ok2:#DFF5E8;--no:#D64545;--no2:#FCE4E4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:none}
input{font:inherit;color:var(--ink)}
.top{background:var(--a);color:#fff;padding:12px 16px 14px}
.top .in{max-width:760px;margin:0 auto}
.top .row{display:flex;align-items:center;gap:10px}
.top .mod{font-weight:900;font-size:12px;letter-spacing:1.2px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{font-size:20px;font-weight:900;line-height:1.2}
.top .sp{flex:1}
.top .stp{background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:10px;overflow:hidden}
.bar div{height:100%;background:#fff;border-radius:99px;transition:width .4s;width:0}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:20px 16px 110px}
.scr{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
h2{font-size:clamp(24px,5vw,32px);font-weight:900;line-height:1.15;display:flex;gap:10px;align-items:center}
.ar{direction:rtl;text-align:right;color:var(--muted);font-weight:700;font-size:17px;margin-top:4px}
.ins{background:var(--a2);border-radius:14px;padding:10px 14px;font-weight:700;margin:12px 0 14px;display:flex;gap:10px;align-items:center}
.ins .ic{font-size:24px}
.cards{display:grid;gap:10px}
.lc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center}
.lc .e{width:56px;height:56px;border-radius:50%;background:var(--a2);display:grid;place-items:center;font-size:28px;flex:none}
.lc b{display:block;font-size:19px}
.lc span{color:var(--muted);font-weight:600;font-size:16px}
.say{background:var(--ink);color:#fff;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:800;margin-top:12px}
.q{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.q .qt{font-weight:800;font-size:19px;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 14px;text-align:left;font-weight:700;font-size:17px;color:var(--ink)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.sel{border-color:var(--a);background:var(--a2)}
.opt.r{background:var(--ok2);border-color:var(--ok)}.opt.w{background:var(--no2);border-color:var(--no)}
.why{margin-top:8px;font-weight:700;font-size:15.5px;padding:8px 12px;border-radius:12px;background:var(--ok2);color:#16583A}
.why.no{background:var(--no2);color:#8A2424}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tiles.wide{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}.tiles.wide .tile{flex-direction:row;text-align:left;gap:12px;padding:12px 14px;font-size:16px}.tiles.wide .tile .e{font-size:30px;flex:none}
.tile{background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 8px;font-weight:800;font-size:15.5px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tile .e{font-size:34px}
.tile.on{border-color:var(--a);background:var(--a2);transform:scale(1.03)}
.own{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.own input{flex:1 1 220px}
.fld{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.fld.done{border-color:var(--ok)}
.fld .lab{font-weight:800;font-size:18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;line-height:2}
input.blank,textarea.blank{resize:none;font:inherit;color:var(--ink);line-height:1.4;border:none;border-bottom:3px dashed var(--a);background:var(--a2);border-radius:8px 8px 0 0;padding:4px 8px;font-weight:700;min-width:0;flex:1 1 100%;width:100%}
input.blank:focus,textarea.blank:focus{outline:none;border-bottom-style:solid}
input.txt{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;width:100%}
input.txt:focus{outline:none;border-color:var(--a)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips .hd{font-size:13px;font-weight:800;color:var(--muted);width:100%}
.chip{background:var(--bg);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14.5px}
.chip:hover{border-color:var(--a)}
.wc{font-size:13px;font-weight:800;color:var(--muted);margin-top:4px}.wc.over{color:var(--no)}
.ord{display:grid;gap:8px}
.ord button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;font-size:17px;text-align:left;display:flex;gap:10px;align-items:center}
.ord button .n{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:15px;flex:none}
.ord button.on{border-color:var(--ok);background:var(--ok2)}.ord button.on .n{background:var(--ok);color:#fff}
.ord button.shake{animation:sh .35s;border-color:var(--no)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rec{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.rec.done{border-color:var(--ok)}
.rec .pl{font-weight:900;font-size:13px;letter-spacing:1.2px;color:var(--a)}
.rec .tx{font-weight:700;font-size:18px;margin:4px 0 10px;background:var(--bg);border-radius:12px;padding:8px 12px}
.rbtn{background:var(--no);color:#fff;font-weight:900;border-radius:99px;padding:10px 18px;font-size:16px}
.rbtn.stop{background:var(--ink)}
audio{width:100%;margin-top:8px}
.ticks{display:grid;gap:6px;margin-top:10px}
.ticks label{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;background:var(--bg);border-radius:12px;padding:8px 12px;cursor:pointer}
.ticks input{width:22px;height:22px;accent-color:var(--ok)}
.clock{font-size:64px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.center{text-align:center}
.ph{display:grid;gap:12px}
.ph .g{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px}
.ph .g h4{font-weight:900;margin-bottom:6px}
.ph .g button{display:block;width:100%;text-align:left;background:var(--bg);border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:700;font-size:16.5px;border:2px solid transparent}
.ph .g button.heard{border-color:var(--ok);background:var(--ok2)}
.slide{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
@media(max-width:520px){.slide{grid-template-columns:1fr}}
.slide .pv{aspect-ratio:16/9;border-radius:10px;background:var(--a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:12px;text-align:center;padding:4px}
.slide .pv .e{font-size:30px}
.emo{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.emo button{font-size:22px;background:var(--bg);border-radius:10px;width:40px;height:40px;border:2px solid transparent}
.emo button.on{border-color:var(--a);background:var(--a2)}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab button{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.ab .mini{width:100%;aspect-ratio:16/9;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;font-size:11px;line-height:1.25;background:#fff;border:1px solid var(--line);color:var(--ink)}
.ab button.r{border-color:var(--ok);background:var(--ok2)}.ab button.w{border-color:var(--no);background:var(--no2)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:2px solid var(--line);padding:10px 16px;backdrop-filter:blur(6px)}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{background:var(--a);color:#fff;font-weight:900;border-radius:16px;padding:14px 22px;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok)}
.btn.dim{opacity:.45}
.nav .msg{flex:1;font-weight:800;font-size:14.5px;color:var(--muted);text-align:center}
.welcome .big{font-size:70px;text-align:center}
.welcome .boxes{display:grid;gap:10px;margin:16px 0}
.welcome label{font-weight:800;font-size:15px;color:var(--muted)}
.what{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
@media(max-width:520px){.what{grid-template-columns:1fr}}
.what div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-weight:800;font-size:15px}
.what div .e{font-size:28px;display:block}
.cert{width:100%;border-radius:16px;box-shadow:0 8px 26px rgba(0,0,0,.15);display:block;margin:12px 0}
.teams{background:#fff;border:2px solid #6264A7;border-radius:18px;padding:14px;margin-top:14px}
.teams h3{color:#464775;font-weight:900;display:flex;gap:8px;align-items:center}
.teams ol{margin:8px 0 0 22px;font-weight:700;font-size:16.5px}
.teams li{margin:4px 0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(200%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;z-index:60;transition:transform .3s;max-width:92vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
footer{text-align:center;color:var(--muted);font-size:13px;padding:6px 16px 100px;font-weight:600}
#printArea{display:none}
@media print{@page{size:A4;margin:10mm}body{background:#fff}body > *:not(#printArea){display:none !important}#printArea{display:block !important}#printArea img{width:100%;max-width:170mm;display:block;margin:0 auto}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="row"><div><div class="mod">MODULE 5 OF 5 · SUPPORT PATHWAY</div><h1>🪑 Answer the Questions</h1></div><div class="sp"></div><div class="stp" id="stp">Start</div></div>
  <div class="bar"><div id="bar"></div></div>
</div></header>
<main id="main"></main>
<footer>TED Talk Support Pathway · LSC 1503 · HCT · Designed by: Nazila Motahari</footer>
<nav class="nav"><div class="in"><button class="btn ghost" id="back" onclick="back()">◀</button><div class="msg" id="msg"></div><button class="btn" id="next" onclick="next()">Next ▶</button></div></nav>
<div class="toast" id="toast"></div><canvas id="confetti"></canvas><div id="printArea"></div>
<script>
const MOD={id:"M5",n:5,title:"Answer the Questions",short:"Answer the Questions",emoji:"🪑",mins:25,ar:"أجب عن أسئلة المعلم",
theme:{a:"#2F5D8A",a2:"#E0ECF8",b:"#E8A33D",ink:"#14243A",bg:"#F5F9FD"},
goals:[["❓","Know the questions"],["🧩","Answer with A + R + E"],["🎙️","Practise out loud"]],
steps:[
 {type:"learn",e:"🪑",title:"After your talk",ar:"بعد الحديث يسألك المعلم",ins:"Your teacher asks you at least 3 questions about how you made your talk.",
  cards:[["🎨","Your slides","Why did you choose that design? Where are your pictures from?"],["💡","Your ideas","How did you get your topic idea? What took the most time?"],["🎤","Your practice","How did you prepare? How did you remember what to say?"],["🪞","Looking back","What would you improve? What was difficult?"]]},
 {type:"learn",e:"🧩",title:"Answer with A + R + E",ar:"أجب: الجواب + السبب + المثال",ins:"Three short parts make a strong answer.",
  cards:[["🅰️","Answer","Say it in one sentence."],["🅁","Reason","“…because…”"],["🅴","Example","One real detail from your talk."]],
  extra:`<div class="q" style="margin-top:12px"><div class="qt">Example</div><div>🧑‍🏫 <i>“Where did you get your pictures?”</i></div><div style="margin-top:6px"><b style="color:var(--a)">A:</b> I took most of them myself. <b style="color:var(--a)">R:</b> because I want to use my own work. <b style="color:var(--a)">E:</b> For example, the photo of my uncle's falcon is mine.</div></div>`},
 {type:"mcq",e:"⚖️",title:"Which answer is better?",ar:"أيّ إجابة أفضل؟",ins:"Choose the stronger answer.",
  items:[{q:"“Why did you choose that design?”",o:["“Desert colours, because my talk is about falconry.”","“Because.”"],a:0,why:"It has an answer and a reason."},
   {q:"“How did you prepare?”",o:["“I don't know.”","“I practised 3 times with my sister, using cue cards.”"],a:1,why:"It has a real example."},
   {q:"“What would you improve?”",o:["“My ending. Next time I would make it stronger.”","“Nothing, it was perfect.”"],a:0,why:"Teachers want to see you can reflect."}]},
 {type:"build",e:"✍️",title:"Prepare my answers",ar:"جهّز إجاباتك",ins:"Complete each answer. Use YOUR talk. Tap an idea to start.",
  fields:[{key:"q1",label:"Design: ___",ph:"I chose … because …",max:18,chars:130,chips:["I chose simple colours because I want people to look at the pictures","I chose big photos because pictures help people remember"]},
   {key:"q2",label:"Pictures: I got my pictures from ___",ph:"e.g. my phone and Unsplash",max:14,chips:["my own phone, and I wrote the sources on my slides","Unsplash and Pexels, and I wrote the sources"]},
   {key:"q3",label:"Practice: I prepared by ___",ph:"e.g. practising with cue cards",max:16,chips:["practising 3 times with cue cards","recording myself and listening","practising in front of my family"]},
   {key:"q4",label:"Difficult: The hardest part was ___",ph:"e.g. speaking slowly",max:16,chips:["speaking slowly, so I practised pausing","finding my topic, so I asked my teacher","remembering my ideas, so I made cue cards"]},
   {key:"q5",label:"Improve: Next time, I would ___",ph:"e.g. start earlier",max:14,chips:["start practising earlier","make my ending stronger","use fewer words on my slides"]}]},
 {type:"phrases",e:"🙋",title:"Polite phrases",ar:"عبارات مهذّبة",ins:"Use these if you need time or don't understand. Listen to at least 4.",need:4,
  groups:[["⏳ Need time",["That's a good question. Let me think.","Hmm, let me see."]],["🤔 Don't understand",["Could you repeat the question, please?","Do you mean my slides or my talk?"]]]},
 {type:"record",e:"🎙️",title:"Practise out loud",ar:"تدرّب بصوت عالٍ",ins:"Read the question. Press Record and ANSWER it. Then listen. Do at least 2.",need:2,
  prompts:[{label:"QUESTION 1",text:"How did you prepare for your talk?"},{label:"QUESTION 2",text:"Where did you get your pictures?"},{label:"QUESTION 3",text:"What would you improve if you had more time?"}],
  checks:["I gave a reason (because…).","I gave a real example.","I spoke clearly and calmly."]},
 {type:"check",e:"🏁",title:"Final check",ar:"الاختبار القصير",ins:"Answer all 5. You need 4 to pass.",pass:4,
  items:[{q:"How many questions does the teacher ask, at least?",o:["3","1","10"],a:0},
   {q:"What does A + R + E mean?",o:["Ask, Read, End","Answer, Reason, Example","Always Read Everything"],a:1},
   {q:"You don't understand the question. You say…",o:["“Next question.”","Nothing","“Could you repeat the question, please?”"],a:2},
   {q:"Which answer is best?",o:["“I practised 3 times with cue cards.”","“I don't know.”","“Because.”"],a:0},
   {q:"Your pictures are from the internet. You should…",o:["say they are yours","say where they are from","say nothing"],a:1}]}
],
summary:[["Design","q1"],["Pictures","q2"],["Practice","q3"],["Hardest part","q4"],["Next time","q5"]]};
const S={name:"",id:"",data:{},done:{},secs:0,score:null,best:null,start:new Date()};
let cur=-1;const $=x=>document.getElementById(x);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function words(s){return (s||"").trim().split(/\s+/).filter(Boolean).length}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2300)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/___/g,"blank").replace(/[“”]/g,""));u.lang="en-GB";u.rate=.85;speechSynthesis.speak(u)}catch(e){toast("Sound is not available on this device")}}
function sub(t){return String(t).replace(/\{(\w+)\}/g,(m,k)=>S.data[k]||"…")}
setInterval(()=>{if(!document.hidden&&cur>=0&&cur<MOD.steps.length)S.secs++},1000);

/* ---------- screens ---------- */
const STEPS=MOD.steps;
function render(){const m=$("main");speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();
  if(cur<0){m.innerHTML=welcome()}else if(cur>=STEPS.length){m.innerHTML=finish();drawCert()}else{const s=STEPS[cur];m.innerHTML=`<div class="scr">${head(s)}${R[s.type](s,cur)}</div>`;if(s.after)s.after();if(s.type==="record")micCheck()}
  const tot=STEPS.length;$("bar").style.width=(cur<0?0:Math.min(cur,tot)/tot*100)+"%";$("stp").textContent=cur<0?"Start":cur>=tot?"🏆 Done":`Step ${cur+1} of ${tot}`;
  $("back").style.visibility=cur<0?"hidden":"visible";$("next").style.display=cur>=tot?"none":"";$("next").textContent=cur<0?"Start ▶":cur===tot-1?"Finish ▶":"Next ▶";updNext();scrollTo({top:0,behavior:"smooth"})}
function head(s){return `<h2>${s.e||""} ${s.title}</h2>${s.ar?`<div class="ar">${s.ar}</div>`:""}${s.ins?`<div class="ins"><span class="ic">👉</span><span>${s.ins}</span></div>`:""}`}
function welcome(){return `<div class="scr welcome"><div class="big">${MOD.emoji}</div><h2 style="justify-content:center;text-align:center">${MOD.title}</h2><div class="ar" style="text-align:center">${MOD.ar}</div>
  <div class="ins"><span class="ic">⏱️</span><span>About ${MOD.mins} minutes. One small task on each screen. Take your time!</span></div>
  <div class="boxes"><div><label>My full name</label><input class="txt" id="nm" value="${esc(S.name)}" maxlength="50" placeholder="e.g. Mariam Ali Alketbi" oninput="S.name=this.value;updNext()"></div>
  <div><label>My HCT ID</label><input class="txt" id="hid" value="${esc(S.id)}" maxlength="12" placeholder="H00…" oninput="S.id=this.value.toUpperCase();updNext()"></div></div>
  <div style="font-weight:900;margin-top:6px">Today you will:</div><div class="what">${MOD.goals.map(g=>`<div><span class="e">${g[0]}</span>${g[1]}</div>`).join("")}</div>
  <div class="ins" style="margin-top:14px"><span class="ic">🏆</span><span>At the end you get a <b>certificate</b>. Upload it to <b>Teams</b>.</span></div></div>`}
const R={
 learn:(s)=>`<div class="cards">${s.cards.map(c=>`<div class="lc"><div class="e">${c[0]}</div><div><b>${c[1]}</b>${c[2]?`<span>${c[2]}</span>`:""}</div></div>`).join("")}</div>${s.cards.length?`<button class="say" onclick='say(${JSON.stringify(s.cards.map(c=>c[1]+". "+(c[2]||"")).join(" "))})'>🔊 Listen</button>`:""}${s.extra||""}`,
 mcq:(s,i)=>{const st=S.done[i]||(S.done[i]={a:{}});return s.items.map((q,k)=>{const ord=q._o||(q._o=shuffle(q.o.map((_,j)=>j)));const a=st.a[k];
   return `<div class="q"><div class="qt">${k+1}. ${q.q}</div><div class="opts">${ord.map(j=>`<button class="opt ${a!==undefined&&a.ok&&j===q.a?"r":""} ${a!==undefined&&!a.ok&&a.last===j?"w":""}" ${a&&a.ok?"disabled":""} onclick="mcq(${i},${k},${j})">${q.o[j]}</button>`).join("")}</div>${a?`<div class="why ${a.ok?"":"no"}">${a.ok?"✅ "+(q.why||"Yes!"):"❌ Not quite. Try again!"}</div>`:""}</div>`}).join("")},
 pick:(s,i)=>{const v=S.data[s.key]||"";return `<div class="tiles ${s.wide?"wide":""}">${s.opts.map(o=>`<button class="tile ${v===o[1]?"on":""}" onclick="pick('${s.key}',${JSON.stringify(o[1]).replace(/"/g,"&quot;")})"><span class="e">${o[0]}</span>${o[1]}</button>`).join("")}</div>
   <div class="own"><span style="font-weight:800">✏️ Or my own:</span><input class="txt" maxlength="40" placeholder="${s.own||"Type here"}" value="${s.opts.some(o=>o[1]===v)?"":esc(v)}" oninput="S.data['${s.key}']=this.value.trim();document.querySelectorAll('.tile').forEach(t=>t.classList.remove('on'));updNext()"></div>`},
 build:(s,i)=>s.fields.map((f,k)=>{const v=S.data[f.key]||"";const parts=sub(f.label).split("___");const n=words(v);

function dl(){const c=$("cv");c.toBlob(b=>{const f=new File([b],fileName(),{type:"image/png"});
  if(navigator.canShare&&/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"My certificate"}).catch(()=>{})}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fileName();a.click()}toast("⬇️ Saved! Now upload it to Teams.")},"image/png")}
function pr(){$("printArea").innerHTML=`<img src="${$("cv").toDataURL("image/png")}">`;setTimeout(()=>window.print(),150)}
function confetti(){const c=$("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=[getComputedStyle(document.documentElement).getPropertyValue("--a").trim(),"#FFC93C","#2E9E62","#fff"],P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*6,c:cols[Math.random()*4|0],vy:2+Math.random()*3,vx:-1.5+Math.random()*3,a:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++t<150)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
addEventListener("beforeunload",e=>{if(cur>=0&&cur<STEPS.length){e.preventDefault();e.returnValue=""}});
render();
</script>
